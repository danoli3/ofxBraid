name: ofxBraid

on:
  push:
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Builds example_tests against openFrameworks master and runs it on localhost.
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux64, os: ubuntu-24.04 }
          - { name: macos, os: macos-15 }
    env:
      OF: ${{ github.workspace }}/of
    steps:
      - name: openFrameworks master
        run: git clone --depth 1 https://github.com/openframeworks/openFrameworks "$OF"

      - uses: actions/checkout@v6
        with:
          path: of/addons/ofxBraid

      - name: ofxENet
        run: git clone --depth 1 https://github.com/danoli3/ofxENet "$OF/addons/ofxENet"

      - name: Dependencies (linux64)
        if: matrix.name == 'linux64'
        run: sudo "$OF/scripts/linux/ubuntu/install_dependencies.sh" -y

      - name: openFrameworks libraries
        run: |
          if [ "${{ matrix.name }}" = "linux64" ]; then
            # master publishes openFrameworksLibs_latest_linux_64_gcc10
            "$OF/scripts/linux/download_libs.sh" -t latest -a 64
          else
            "$OF/scripts/osx/download_libs.sh" -t latest
          fi

      - name: Build and run example_tests
        run: |
          JOBS=$(getconf _NPROCESSORS_ONLN)
          if ! make -C "$OF/addons/ofxBraid/example_tests" -j"$JOBS" Release; then
            echo "::error title=Build failed::example_tests"
            exit 1
          fi
          cd "$OF/addons/ofxBraid/example_tests"
          if [ "${{ matrix.name }}" = "macos" ]; then
            bin/example_tests.app/Contents/MacOS/example_tests
          else
            bin/example_tests
          fi
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
